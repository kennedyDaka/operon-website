<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#000000"/>
  
  <!-- Circuit/Network Icon -->
  <g transform="translate(200, 155)" fill="none" stroke="#1a5276" stroke-width="3" stroke-linecap="round">
    <!-- Center square -->
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#1a5276"/>
    
    <!-- Top-left square -->
    <rect x="-75" y="-75" width="30" height="30" rx="4" fill="#1a5276"/>
    <!-- Top-left to center connections -->
    <line x1="-45" y1="-60" x2="-18" y2="-18"/>
    <line x1="-60" y1="-45" x2="-18" y2="-18"/>
    
    <!-- Top-right square -->
    <rect x="45" y="-75" width="30" height="30" rx="4" fill="#1a5276"/>
    <!-- Top-right to center connections -->
    <line x1="45" y1="-60" x2="18" y2="-18"/>
    <line x1="60" y1="-45" x2="18" y2="-18"/>
    
    <!-- Bottom-left square -->
    <rect x="-75" y="45" width="30" height="30" rx="4" fill="#1a5276"/>
    <!-- Bottom-left to center connections -->
    <line x1="-45" y1="60" x2="-18" y2="18"/>
    <line x1="-60" y1="45" x2="-18" y2="18"/>
    
    <!-- Bottom-right square -->
    <rect x="45" y="45" width="30" height="30" rx="4" fill="#1a5276"/>
    <!-- Bottom-right to center connections -->
    <line x1="45" y1="60" x2="18" y2="18"/>
    <line x1="60" y1="45" x2="18" y2="18"/>
    
    <!-- Horizontal connections -->
    <line x1="-75" y1="-30" x2="-18" y2="-10"/>
    <line x1="18" y1="-10" x2="75" y2="-30"/>
    
    <!-- Vertical connections -->
    <line x1="-30" y1="-75" x2="-10" y2="-18"/>
    <line x1="-10" y1="18" x2="-30" y2="75"/>
    
    <!-- Diagonal lines -->
    <line x1="-45" y1="-45" x2="-18" y2="-18" opacity="0.5"/>
    <line x1="18" y1="-18" x2="45" y2="-45" opacity="0.5"/>
    <line x1="-45" y1="45" x2="-18" y2="18" opacity="0.5"/>
    <line x1="18" y1="18" x2="45" y2="45" opacity="0.5"/>
  </g>
  
  <!-- OPERON Text -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#1a5276" letter-spacing="4">OPERON</text>
  
  <!-- SYSTEMS Text -->
  <text x="200" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1a5276" letter-spacing="12">SYSTEMS</text>
</svg>
