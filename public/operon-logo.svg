<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff"/>
  
  <!-- Circuit/Network Icon -->
  <g transform="translate(400, 290)" fill="none" stroke="#14304a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center square -->
    <rect x="-32" y="-32" width="64" height="64" rx="8" fill="#14304a" stroke="none"/>
    
    <!-- Top-left square -->
    <rect x="-130" y="-130" width="52" height="52" rx="8" fill="#14304a" stroke="none"/>
    <!-- Top-left to center -->
    <line x1="-78" y1="-104" x2="-32" y2="-32"/>
    <line x1="-104" y1="-78" x2="-32" y2="-32"/>
    
    <!-- Top-right square -->
    <rect x="78" y="-130" width="52" height="52" rx="8" fill="#14304a" stroke="none"/>
    <!-- Top-right to center -->
    <line x1="78" y1="-104" x2="32" y2="-32"/>
    <line x1="104" y1="-78" x2="32" y2="-32"/>
    
    <!-- Bottom-left square -->
    <rect x="-130" y="78" width="52" height="52" rx="8" fill="#14304a" stroke="none"/>
    <!-- Bottom-left to center -->
    <line x1="-78" y1="104" x2="-32" y2="32"/>
    <line x1="-104" y1="78" x2="-32" y2="32"/>
    
    <!-- Bottom-right square -->
    <rect x="78" y="78" width="52" height="52" rx="8" fill="#14304a" stroke="none"/>
    <!-- Bottom-right to center -->
    <line x1="78" y1="104" x2="32" y2="32"/>
    <line x1="104" y1="78" x2="32" y2="32"/>
    
    <!-- Horizontal connections -->
    <line x1="-130" y1="-54" x2="-32" y2="-18"/>
    <line x1="32" y1="-18" x2="130" y2="-54"/>
    
    <!-- Vertical connections -->
    <line x1="-54" y1="-130" x2="-18" y2="-32"/>
    <line x1="-18" y1="32" x2="-54" y2="130"/>
    
    <!-- Diagonal lines -->
    <line x1="-78" y1="-78" x2="-32" y2="-32" opacity="0.6"/>
    <line x1="32" y1="-32" x2="78" y2="-78" opacity="0.6"/>
    <line x1="-78" y1="78" x2="-32" y2="32" opacity="0.6"/>
    <line x1="32" y1="32" x2="78" y2="78" opacity="0.6"/>
  </g>
  
  <!-- OPERON Text -->
  <text x="400" y="500" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="90" font-weight="700" fill="#14304a" letter-spacing="2">OPERON</text>
  
  <!-- SYSTEMS Text -->
  <text x="400" y="570" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="38" fill="#14304a" letter-spacing="16">SYSTEMS</text>
</svg>
